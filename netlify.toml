[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "./plugins/indexnow-on-deploy"

# Bundle the (now non-public) demo HTML into the gate function.
[functions]
  node_bundler = "esbuild"
  included_files = ["demos/**"]

# Pretty share URL -> gated function. Name goes in the PATH (Netlify drops the
# destination query for function rewrites); the original ?t=<token> is forwarded.
[[redirects]]
  from = "/d/:name"
  to = "/.netlify/functions/demo/:name"
  status = 200

# Old direct demo paths are dead ends now: route them through the gate so
# a token-less hit shows the branded "link no longer valid" page.
[[redirects]]
  from = "/owneros_demo"
  to = "/.netlify/functions/demo/owneros"
  status = 200
[[redirects]]
  from = "/owneros_demo/*"
  to = "/.netlify/functions/demo/owneros"
  status = 200
[[redirects]]
  from = "/inteldb_demo"
  to = "/.netlify/functions/demo/inteldb"
  status = 200
[[redirects]]
  from = "/inteldb_demo/*"
  to = "/.netlify/functions/demo/inteldb"
  status = 200

# The pretty path Vinh hands out for the NASA sample. Token-less hits land on
# the branded "link no longer valid" page, same as the other bare demo paths;
# the live link is /d/nasa?t=<token>.
[[redirects]]
  from = "/nasa_sample"
  to = "/.netlify/functions/demo/nasa"
  status = 200
[[redirects]]
  from = "/nasa_sample/*"
  to = "/.netlify/functions/demo/nasa"
  status = 200
